<body class="Maximize">
    <div id="super">
        <div id="nanogallery"></div>

        <footer id="footer-nav">
            <ul>
                <li><a href="https://github.com/maxhbr">GitHub</a></li>
                <li><a href="impress.html">Impress</a></li>
            </ul>
        </footer>
    </div>
    <div id="header">
        <div id="lowerHeader">
            <div id="logoWrapper"><a href="./"><img src="https://maximilian-huber.de/images/logo-dark2.png" alt="maximilian-huber.de" id="logo"></a>
            </div>
        </div>
        <nav id="sidebar-nav">
            <ul>
                <li><a href="?galleryFilterTags=true">Tags</a></li>
                <li><a href="https://github.com/maxhbr">GitHub</a></li>
                <li><a href="impress.html">Impress</a></li>
            </ul>
        </nav>
    </div>
    <script>
        let itemsBaseURL = 'https://maximilian-huber.de/_8k/';
        fetch(itemsBaseURL + '/index.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load gallery data');
                }
                return response.json();
            })
            .then(items => {
                jQuery('#nanogallery').nanogallery2({
                    items: items.map(it => (Object.assign({
                        src: itemsBaseURL + it.src,
                        title: ((it.sortKey || "") + it.src.split('/').reverse()[0]),
                        tags: (it.tags || []).join(' ')
                    }, it.srct ? { srct: itemsBaseURL + it.srct } : {}))),
                    itemsBaseURL: itemsBaseURL,
                    galleryFilterTags: new URLSearchParams(window.location.search).get('galleryFilterTags') === 'true',
                    galleryFilterTagsMode: 'single',
                    thumbnailHeight: 250,
                    thumbnailWidth: 250,
                    thumbnailAlignment: 'fillWidth',
                    galleryDisplayMode: 'fullContent',
                    gallerySorting: 'titleDesc',
                    thumbnailGutterWidth: 10,
                    thumbnailGutterHeight: 10,
                    thumbnailBorderHorizontal: 2,
                    thumbnailBorderVertical: 2,
                    galleryDisplayTransitionDuration: 1000,
                    thumbnailDisplayTransition: 'fadeIn',
                    thumbnailDisplayTransitionDuration: 300,
                    thumbnailDisplayInterval: 150,
                    thumbnailDisplayOrder: 'colFromRight',
                    thumbnailLabel: {
                        display: false,
                        position: 'onBottomOverImage',
                        hideIcons: true,
                        titleFontSize: '1em',
                        align: 'left',
                        titleMultiLine: true,
                        displayDescription: false
                    },
                    thumbnailToolbarImage: null,
                    thumbnailToolbarAlbum: null,
                    thumbnailHoverEffect2: 'label_font-size_1em_1.5em|title_backgroundColor_rgba(255,255,255,0.34)_rgba(((35,203,153,0.8)|title_color_#000_#fff|image_scale_1.00_1.10_5000|image_rotateZ_0deg_4deg_5000',
                    touchAnimation: true,
                    touchAutoOpenDelay: 800,
                    galleryTheme: {
                        thumbnail: { titleShadow: 'none', titleColor: '#fff', borderColor: '#fff' },
                        navigationBreadcrumb: { background: '#3C4B5B' },
                        navigationFilter: { background: '#003C3F', backgroundSelected: '#2E7C7F', color: '#fff' }
                    },
                    locationHash: false
                });
                /*
                const moveFilterToHeader = () => {
                    const navBar = document.querySelector('#nanogallery .nGY2Navigationbar');
                    const headerBar = document.getElementById('lowerHeader') || document.getElementById('header');
                    if (navBar && headerBar && navBar.dataset.moved !== 'true') {
                        headerBar.appendChild(navBar);
                        navBar.dataset.moved = 'true';
                        navBar.classList.add('ngy2-filter-in-header');
                    }
                };
                jQuery('#nanogallery')
                    .on('nanogallery2.GalleryObjectModelBuilt', moveFilterToHeader)
                    .on('nanogallery2.GalleryLayoutApplied', moveFilterToHeader);
                moveFilterToHeader();
                */
            })
            .catch(err => {
                console.error('Error initializing gallery', err);
                document.getElementById('nanogallery').innerHTML = '<p style="padding: 16px; color: #fff;">Failed to load gallery data.</p>';
            });
    </script>
</body>

</html>
